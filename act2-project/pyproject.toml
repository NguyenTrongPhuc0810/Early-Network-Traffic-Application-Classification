[project]
name = "act2-project"
version = "0.1.0"
description = "Standalone CLI-only Act 2 SPLT pipeline from PCAP to classification artifacts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
]

[project.scripts]
act2 = "act2_project.cli:main"

[project.optional-dependencies]
pcap = [
  "nfstream>=6.5",
]
test = [
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
